upstream web_app {
    server web:8000;
}

# In production TLS is terminated by the HOST nginx, which forwards plain HTTP to
# this container. Blindly setting X-Forwarded-Proto to $scheme would tell Django
# the request was http, and production.py's SECURE_SSL_REDIRECT would bounce it
# back to https forever. Honour the header the host nginx already sent; fall back
# to $scheme only when there is no proxy in front (local `docker compose up`).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Only send `Connection: upgrade` for requests that actually asked to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    client_max_body_size 10M;   # avatar uploads

    # Proxy HTTP + WebSocket to the ASGI app (uvicorn / Daphne)
    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived game sockets: don't drop an idle-but-alive connection.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files
    location /media/ {
        alias /app/media/;
    }
}
