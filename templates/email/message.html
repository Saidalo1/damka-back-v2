<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damka.uz</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="440" cellpadding="0" cellspacing="0"
               style="max-width:440px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#DC834A;padding:28px 32px;text-align:center;">
              <span style="color:#ffffff;font-size:24px;font-weight:bold;letter-spacing:0.5px;">Damka.uz</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#18181b;">
              <p style="margin:0 0 8px;font-size:16px;">Assalomu alaykum{% if username %}, {{ username }}{% endif %}!</p>
              <p style="margin:0 0 24px;font-size:14px;color:#52525b;line-height:1.5;">
                Tasdiqlash kodingiz / Ваш код подтверждения:
              </p>
              <div style="text-align:center;margin:0 0 24px;">
                <span style="display:inline-block;padding:14px 28px;background:#f4f4f5;border-radius:12px;
                             font-size:32px;font-weight:bold;letter-spacing:8px;color:#DC834A;">{{ code }}</span>
              </div>
              <p style="margin:0;font-size:12px;color:#a1a1aa;line-height:1.5;">
                Agar bu siz bo'lmasangiz, bu xabarni e'tiborsiz qoldiring.<br>
                Если это были не вы, просто проигнорируйте это письмо.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;background:#fafafa;text-align:center;color:#a1a1aa;font-size:12px;">
              © Damka.uz
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
