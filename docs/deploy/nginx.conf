# damka.uz — HOST nginx (TLS edge + certbot) for BOTH the frontend and backend.
#
# Architecture:
#   • Frontend (Nuxt SSR) runs under PM2 on 127.0.0.1:3000        → damka.uz
#   • Backend  (docker compose) exposes its compose-nginx on
#     127.0.0.1:8080 (WS + /static + /media, see note)            → cp.damka.uz
#   This host nginx terminates TLS for both and forwards the requests. The
#   `Upgrade`/`Connection` block on the backend is what keeps the game sockets
#   working through the proxy.
#
# Backend note: in the repo's docker-compose.yml the nginx service publishes
# "80:80" — for production change it to "127.0.0.1:8080:80" so this host nginx
# can sit in front of it without a port clash and it isn't exposed publicly.
#
# Certs (one-time):  certbot certonly --webroot -w /var/www/certbot \
#                      -d damka.uz -d www.damka.uz -d cp.damka.uz
# Then:  nginx -t && systemctl reload nginx   (certbot auto-renews via its timer)

# ── ACME challenge + HTTP→HTTPS for every domain ─────────────────────────────
server {
    listen 80;
    server_name damka.uz www.damka.uz cp.damka.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Frontend: damka.uz → Nuxt SSR (PM2) on :3000 ─────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name damka.uz www.damka.uz;

    ssl_certificate     /etc/letsencrypt/live/damka.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damka.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;   # PM2 Nitro node server
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend: cp.damka.uz → docker compose nginx on :8080 ─────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name cp.damka.uz;

    ssl_certificate     /etc/letsencrypt/live/cp.damka.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp.damka.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;   # avatar uploads

    # WebSocket endpoints (/ws/game/…, /ws/matchmaking/…, /ws/game/bot/).
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # ← the socket upgrade
        proxy_set_header Connection "upgrade";         # ← required for Channels
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived sockets (players think for minutes)
        proxy_send_timeout 3600s;
    }

    # REST API, admin, /static, /media (the compose nginx serves those).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
